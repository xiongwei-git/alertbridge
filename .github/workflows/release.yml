name: Release container image

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  ACR_IMAGE: ${{ vars.ACR_IMAGE }}
  ACR_USERNAME: ${{ vars.ACR_USERNAME }}

jobs:
  verify:
    if: github.event_name == 'push'
    name: Test release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Verify release version
        run: test "$(cat VERSION)" = "$GITHUB_REF_NAME"

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.5
          cache: true

      - name: Run unit tests
        run: go test ./...

      - name: Run static analysis
        run: go vet ./...

      - name: Check release configuration
        run: ./test/release/run.sh

      - name: Run Docker end-to-end tests
        run: ./test/e2e/run.sh

  publish:
    if: github.event_name == 'push'
    name: Publish multi-architecture image
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.prepare.outputs.digest }}
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Check required public ACR configuration
        id: acr
        env:
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          test -n "$ACR_USERNAME" && test -n "$ACR_PASSWORD"
          echo "$ACR_IMAGE" | grep -Eq '^crpi-[a-z0-9]+\.cn-[a-z0-9-]+\.personal\.cr\.aliyuncs\.com/[a-z0-9_-]+/[a-z0-9_-]+$'
          echo "registry=${ACR_IMAGE%%/*}" >> "$GITHUB_OUTPUT"

      - name: Install OCI upload tool
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y skopeo

      - name: Log in to ACR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ${{ steps.acr.outputs.registry }}
          username: ${{ env.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.ACR_IMAGE }}
          tags: |
            type=semver,pattern={{raw}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=AlertBridge
            org.opencontainers.image.description=Lightweight secure notification gateway
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      # ACR Personal rejects attestation manifests. Keep both evidence types in
      # the same OCI build, validate them, then upload only runtime manifests.
      - name: Build multi-architecture image with evidence
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          outputs: type=oci,dest=${{ runner.temp }}/image.tar
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Validate build evidence and prepare runtime index
        id: prepare
        run: |
          mkdir "$RUNNER_TEMP/oci"
          tar -xf "$RUNNER_TEMP/image.tar" -C "$RUNNER_TEMP/oci"
          digest=$(python3 scripts/release-evidence.py prepare "$RUNNER_TEMP/oci" "$RUNNER_TEMP/evidence")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest build evidence files
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4
        with:
          subject-path: ${{ runner.temp }}/evidence/*
          push-to-registry: false

      - name: Preserve validated SBOM and provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-evidence-${{ github.ref_name }}
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: error
          retention-days: 90

      - name: Push directly to ACR and verify every tag
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r image; do
            test -n "$image"
            skopeo copy --all --preserve-digests \
              --authfile "$HOME/.docker/config.json" \
              "oci:$RUNNER_TEMP/oci:release" "docker://$image"
            docker buildx imagetools inspect --raw "$image" > "$RUNNER_TEMP/remote-index.json"
            python3 scripts/release-evidence.py verify "$RUNNER_TEMP/evidence" "$RUNNER_TEMP/remote-index.json"
          done <<< "$IMAGE_TAGS"

      - name: Attest image provenance
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4
        with:
          subject-name: ${{ env.ACR_IMAGE }}
          subject-digest: ${{ steps.prepare.outputs.digest }}
          push-to-registry: false
