openapi: 3.1.0
info:
  title: AlertBridge API
  version: 1.4.0
paths:
  /mcp:
    post:
      summary: Optional route-scoped read-only MCP transport
      description: Disabled unless independently configured. Streamable HTTP JSON-RPC tools list_alerts, get_alert and list_active_incidents. See docs/mcp.md for schemas, cursors and client setup. This does not use notification ingress tokens.
      security:
        - MCPBearerAuth: []
        - MCPOAuth: ['alerts:read']
      responses:
        '200':
          description: MCP JSON-RPC result (tool errors may also be represented in MCP results)
        '401': { description: Missing or invalid MCP credential }
        '429': { description: MCP request limit exceeded }
        '404': { description: MCP is disabled }
  /.well-known/oauth-protected-resource/mcp:
    get:
      summary: Discover the optional MCP protected resource
      responses:
        '200': { description: Resource identifier and authorization server metadata location }
        '404': { description: OAuth is disabled }
  /.well-known/oauth-authorization-server:
    get:
      summary: Discover the optional OAuth authorization server
      responses:
        '200': { description: Issuer, endpoints, public client authentication and PKCE S256 support }
        '404': { description: OAuth is disabled }
  /admin/mcp/authorize:
    get:
      summary: Authenticate the administrator and display read-only OAuth consent
      responses:
        '200': { description: Consent form bound to the administrator session }
        '303': { description: Redirect to administrator login }
        '400': { description: Invalid client, callback, scope, resource or PKCE challenge }
    post:
      summary: Confirm or deny OAuth consent with administrator CSRF protection
      responses:
        '303': { description: Exact allowlisted callback with issuer and state plus a code or denial }
        '403': { description: CSRF validation failed }
  /oauth/token:
    post:
      summary: Exchange a single-use authorization code or rotate a refresh token
      description: Form-urlencoded. client_id is alertbridge-dots; no client secret. Require the exact MCP resource. Authorization code exchange also requires redirect_uri and a valid PKCE code_verifier. Refresh accepts refresh_token. Only alerts:read is supported.
      responses:
        '200': { description: Opaque access token, rotating refresh token, Bearer type, 3600 second access lifetime and scope }
        '400': { description: OAuth invalid_request, invalid_grant, invalid_target or unsupported_grant_type }
        '401': { description: invalid_client }
        '429': { description: Token endpoint rate limit exceeded }
  /oauth/revoke:
    post:
      summary: Revoke the OAuth grant belonging to the supplied token
      description: Form-urlencoded client_id and token; no client secret. Unknown tokens also return success.
      responses:
        '200': { description: Grant revoked or token not recognized }
  /api/v1/notifications:
    post:
      summary: Accept a constrained one-off notification
      description: The Bearer token fixes source, routing key, severity, and rate limit. The server generates an info event and persists it through the normal delivery queue.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Notification'
      responses:
        '200':
          description: Notification durably queued; HTTP 200 is used for Baota webhook compatibility
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accepted'
        '400': { $ref: '#/components/responses/Error' }
        '401':
          description: Invalid or disabled Bearer token
          headers:
            WWW-Authenticate:
              schema: { type: string }
              description: Bearer challenge
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/events:
    post:
      summary: Accept a notification event
      security:
        - ClientID: []
          Timestamp: []
          Nonce: []
          Signature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Event'
      responses:
        '202':
          description: Event durably accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accepted'
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /healthz:
    get:
      summary: Liveness check
      responses:
        '200': { $ref: '#/components/responses/Health' }
  /readyz:
    get:
      summary: Readiness check
      responses:
        '200': { $ref: '#/components/responses/Health' }
        '503': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    MCPOAuth:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: /admin/mcp/authorize
          tokenUrl: /oauth/token
          refreshUrl: /oauth/token
          scopes:
            alerts:read: Read configured alert routes only
    MCPBearerAuth: { type: http, scheme: bearer }
    BearerAuth: { type: http, scheme: bearer }
    ClientID: { type: apiKey, in: header, name: X-Notify-Client }
    Timestamp: { type: apiKey, in: header, name: X-Notify-Timestamp }
    Nonce: { type: apiKey, in: header, name: X-Notify-Nonce }
    Signature: { type: apiKey, in: header, name: X-Notify-Signature }
  schemas:
    Notification:
      type: object
      additionalProperties: false
      required: [title, message]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: Must not contain line breaks.
        message: { type: string, minLength: 1, maxLength: 4000 }
        category:
          type: string
          maxLength: 64
          description: Optional category copied to the category label. Must not contain line breaks.
        url: { type: string, format: uri }
    Event:
      type: object
      additionalProperties: false
      required: [event_id, source, routing_key, status, severity, title, message, occurred_at]
      properties:
        event_id: { type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$' }
        source: { type: string, minLength: 1, maxLength: 64, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$' }
        routing_key: { type: string, minLength: 1, maxLength: 64, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$' }
        status:
          type: string
          enum: [firing, resolved, info, test]
          description: firing opens or refreshes an incident; resolved closes the matching incident; info and test are one-off events.
        severity: { type: string, enum: [critical, warning, info] }
        title: { type: string, minLength: 1, maxLength: 200 }
        message: { type: string, minLength: 1, maxLength: 4000 }
        occurred_at: { type: string, format: date-time }
        dedupe_key:
          type: string
          maxLength: 128
          pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'
          description: Required for firing and resolved. The same client, routing_key, and dedupe_key identify one incident lifecycle.
        labels:
          type: object
          maxProperties: 20
          additionalProperties: { type: string, maxLength: 256 }
        url: { type: string, format: uri, maxLength: 2048 }
    Accepted:
      type: object
      required: [request_id, event_record_id, event_id, outcome, deliveries]
      properties:
        request_id: { type: string }
        event_record_id: { type: string }
        event_id: { type: string }
        outcome: { type: string, enum: [queued, suppressed, duplicate] }
        reason: { type: string, enum: [dedupe_window, orphan_resolved, silence] }
        deliveries: { type: integer, minimum: 0 }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code: { type: string }
            message: { type: string }
            request_id: { type: string }
  responses:
    Error:
      description: Structured error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Health:
      description: Health status
      content:
        application/json:
          schema:
            type: object
            required: [status]
            properties:
              status: { type: string }
